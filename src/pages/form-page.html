<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Form Questions</title>
        <!-- Links -->
        <!-- Css -->
        <link rel="stylesheet" href="../styles/main.css">
    </head>
    <body>
        <figure id="main-figure" class="main-figure">
            <img class="image" src="" alt="Company Character">
        </figure>

        <main>
            <section id="form-page-p1" class="form-page">
                <div>
                    <h3>Necessities of working in financial markets</h3>
                    <p>This research is to find the reasons for the failure of people in financial markets. The results of this survey will be emailed to you along with the analysis of our experienced experts.</p>
                </div>
                <div>
                    <a href="../../public/index.html">
                        <button type="button">Back to Home</button>
                    </a>
                    <button type="button" class="next-btn">Fill out the form</button>
                </div>
            </section>
        
            <section id="form-page-p2" class="form-page hide">
                <form action="">
                    <div>
                        <label for="account-status-form" class="label-form-question">What is the status of your account?</label>
                        <select id="account-status-form" name="account-status-form">
                            <option value="account-not-created">I have not created an account yet.</option>
                            <option value="account-created">I have created an account yet.</option>
                        </select>
                    </div>
                    <div>
                        <label class="label-form-question">In which financial markets do you operate?</label><br>
                        
                        <label class="custom-radio">
                            <input type="radio" id="stock_market" name="market_area" value="stock_market">
                            <span class="radio-button"></span>
                            Stock Market
                        </label><br>
                        
                        <label class="custom-radio">
                            <input type="radio" id="foreign_market" name="market_area" value="foreign_market">
                            <span class="radio-button"></span>
                            Foreign Market
                        </label><br>
                        
                        <label class="custom-radio">
                            <input type="radio" id="commodity" name="market_area" value="commodity">
                            <span class="radio-button"></span>
                            Commodity
                        </label><br>
                        
                        <label class="custom-radio">
                            <input type="radio" id="bond_market" name="market_area" value="bond_market">
                            <span class="radio-button"></span>
                            Bond Market
                        </label><br>
                        
                        <label class="custom-radio">
                            <input type="radio" id="cryptocurrency_market" name="market_area" value="cryptocurrency_market">
                            <span class="radio-button"></span>
                            Cryptocurrency Market
                        </label><br>
                    </div>
                </form>
                <div>
                    <button type="button" class="back-btn">Back</button>
                    <button type="button" class="next-btn">Next</button>
                    <button type="button" class="skip-btn">Skip</button>
                </div>
            </section>
        
            <section id="form-page-p3" class="form-page hide">
                <form action="">
                    <div>
                        <label for="invest-question-form" class="label-form-question">How do you decide to invest?</label>
                        <select id="invest-question-form" name="invest-question-form">
                            <option value="not-invested">I have not invested yet.</option>
                            <option value="invested">I have invested yet.</option>
                        </select>
                    </div>
                    <div>
                        <label class="label-form-question">What resources have you used or are you using for your training?</label><br>
                        
                        <label class="custom-radio">
                            <input type="radio" name="market_investment" class="custom-radio" value="Books_articles">
                            <span class="radio-button"></span>
                            Books and articles
                        </label><br>
                        
                        <label class="custom-radio">
                            <input type="radio" name="market_investment" class="custom-radio" value="youtube_videos">
                            <span class="radio-button"></span>
                            YouTube tutorial videos
                        </label><br>

                        <label class="custom-radio">
                            <input type="radio" name="market_investment" class="custom-radio" value="online_f2f">
                            <span class="radio-button"></span>
                            online or face to face courses
                        </label><br>

                        <label class="custom-radio">
                            <input type="radio" name="market_investment" class="custom-radio" value="experience">
                            <span class="radio-button"></span>
                            experience with little investment
                        </label><br>

                    </div>
                </form>
                <div>
                    <button type="button" class="back-btn">Back</button>
                    <button type="button" class="next-btn">Next</button>
                    <button type="button" class="skip-btn">Skip</button>
                </div>
            </section>
        
            <section id="form-page-p4" class="form-page hide">
                <form action="">
                    <label for="investment_details" class="label-form-question">If you or someone close to you has already made a loss on the investment, write down the details</label>
        
                    <textarea name="investment_details" id="investment_details" rows="5" cols="50"></textarea>
                </form>
                <div>
                    <button type="button" class="back-btn">Back</button>
                    <button type="button" class="next-btn">Next</button>
                    <button type="button" class="skip-btn">Skip</button>
                </div>
            </section>
        
            <section id="form-page-p5" class="form-page hide">
                <form action="">
                    <div>
                        <label for="name">Name:</label>
                        <input type="text" id="name" placeholder="Nasser Toghiri">
                    </div>
                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" placeholder="N.Toghiri@Gmail.com">
                    </div>
                    <div>
                        <label for="age">Age:</label>
                        <input type="number" id="age" placeholder="-- --">
                    </div>
                </form>
                <div>
                    <button type="button" class="back-btn">Back</button>
                    <button type="button" id="submit-form">Submit</button>
                </div>
            </section>
        </main>

        <script src="../scripts/main.js"></script>
</body>
</html>
